<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Slipstream GT</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Slipstream GT">
<meta name="theme-color" content="#12151b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<style>
/* Layout: full-bleed 3D stage. Menus sit in a left rail in landscape and a bottom sheet in portrait; the car turntable fills the rest. */
:root{
  --asphalt:#12151b; --panel:#1a1f28; --panel-2:#232a36; --line:#323a49;
  --ink:#f1f3f7; --muted:#97a0b2; --signal:#ffc62b; --signal-ink:#1a1400; --kerb:#e5322d; --ok:#3ddc84;
  --f-display:"Saira Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --f-body:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--asphalt);color:var(--ink);overflow:hidden;font-family:var(--f-body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Menu ---------- */
#menu{position:fixed;inset:0;z-index:3;display:flex;pointer-events:none}
#rail{pointer-events:auto;background:linear-gradient(90deg,rgba(18,21,27,.97) 0%,rgba(18,21,27,.93) 82%,rgba(18,21,27,0) 100%);
  width:min(470px,50vw);height:100%;box-sizing:border-box;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  padding-block:calc(var(--sat) + 14px) calc(var(--sab) + 18px);padding-left:calc(var(--sal) + 18px);padding-right:34px;
  display:flex;flex-direction:column;gap:14px}
#rail>*{flex-shrink:0}
#carTag{position:absolute;right:calc(var(--sar) + 20px);bottom:calc(var(--sab) + 16px);text-align:right;pointer-events:none}
#carTag .cls{display:inline-block;font:700 12px/1 var(--f-display);letter-spacing:.12em;background:var(--signal);color:var(--signal-ink);padding:4px 7px 3px;border-radius:3px}
#carTag h2{font:800 clamp(26px,4.4vw,46px)/.95 var(--f-display);margin:8px 0 2px;text-transform:uppercase;letter-spacing:.01em;text-shadow:0 2px 18px rgba(0,0,0,.6)}
#carTag .pr{font:600 14px var(--f-display);letter-spacing:.14em;color:var(--muted)}
#carTag .pr b{color:var(--ink);font-size:20px}
#carTag .spec{font:500 13px var(--f-display);letter-spacing:.08em;color:var(--muted);margin-top:2px}
#app.portrait #menu{flex-direction:column;justify-content:flex-end}
#app.portrait #rail{width:100%;height:auto;max-height:64%;background:linear-gradient(180deg,rgba(18,21,27,0) 0,rgba(18,21,27,.95) 40px,rgba(18,21,27,.97) 100%);
    padding-top:40px;padding-right:calc(var(--sar) + 16px);padding-left:calc(var(--sal) + 16px)}
#app.portrait #carTag{top:calc(var(--sat) + 64px);bottom:auto;right:16px}
#app{position:fixed;inset:0;overflow:hidden}
#app.rot{inset:auto;top:0;left:0;transform-origin:0 0}
#app.rot90{transform:rotate(90deg) translateY(-100%);--sal:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-bottom,0px);--sat:0px;--sab:0px}
#app.rot270{transform:rotate(-90deg) translateX(-100%);--sal:env(safe-area-inset-bottom,0px);--sar:env(safe-area-inset-top,0px);--sat:0px;--sab:0px}
#rotHint{position:absolute;inset:0;z-index:9;display:grid;place-content:center;justify-items:center;gap:14px;background:rgba(8,10,14,.82);font:700 22px var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-align:center;color:var(--ink)}
.topbar{display:flex;align-items:center;gap:10px;min-height:40px}
.topbar .back{width:40px;height:40px;border-radius:8px;background:var(--panel-2);display:grid;place-items:center;flex:none}
.topbar h1{font:800 26px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallet{display:flex;gap:8px;flex:none}
.chip{font:700 14px/1 var(--f-display);letter-spacing:.06em;background:var(--panel-2);padding:7px 9px 6px;border-radius:6px;white-space:nowrap}
.chip .cr,.chip .st{color:var(--signal)}
.logo{font:800 italic 44px/.86 var(--f-display);text-transform:uppercase;letter-spacing:-.01em;margin:6px 0 2px}
.logo span{color:var(--signal)}
.logo-sub{font:600 12px var(--f-display);letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
.bigbtns{display:grid;gap:10px}
.bigbtn{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.bigbtn:active{background:var(--panel-2)}
.bigbtn.primary{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.bigbtn .t{font:800 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.bigbtn .d{font-size:13px;opacity:.75;margin-top:3px}
.bigbtn .arrow{margin-left:auto;font:700 22px var(--f-display);opacity:.6}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:left;width:100%;box-sizing:border-box}
.row:active{background:var(--panel-2)}
.row.locked{opacity:.5}
.row .main{flex:1;min-width:0}
.row .t{font:700 19px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.row .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.row .r{text-align:right;flex:none}
.stars{color:var(--signal);letter-spacing:1px;font-size:15px}
.stars .off{color:#465064}
.tag{display:inline-block;font:700 11px/1 var(--f-display);letter-spacing:.1em;padding:4px 6px 3px;border-radius:3px;background:var(--panel-2);color:var(--muted);text-transform:uppercase}
.tag.y{background:var(--signal);color:var(--signal-ink)}
.tag.r{background:var(--kerb);color:#fff}
.section-h{font:700 13px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:6px 0 -2px}
.carchips{display:flex;gap:8px;overflow-x:auto;touch-action:pan-x;padding-bottom:2px}
.carchip{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left}
.carchip.on{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.carchip .t{font:700 15px/1 var(--f-display);text-transform:uppercase}
.carchip .d{font-size:11px;color:var(--muted);margin-top:3px}
.stat{display:grid;grid-template-columns:96px 1fr 62px;align-items:center;gap:10px;font-size:13px}
.stat .lab{color:var(--muted);font:600 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.bar{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:3px}
.bar i.up{background:var(--signal)}
.stat .v{text-align:right;font:600 14px var(--f-display)}
.upg{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px 9px 12px}
.upg .main{flex:1;min-width:0}
.upg .t{font:700 17px/1 var(--f-display);text-transform:uppercase}
.pips{display:flex;gap:3px;margin-top:6px}
.pips i{width:20px;height:5px;border-radius:2px;background:var(--panel-2)}
.pips i.on{background:var(--signal)}
.btn{font:800 16px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;padding:11px 14px 10px;border-radius:8px;background:var(--panel-2);white-space:nowrap}
.btn.y{background:var(--signal);color:var(--signal-ink)}
.btn.r{background:var(--kerb);color:#fff}
.btn:disabled{opacity:.4}
.btn.wide{width:100%;padding:15px 14px 14px;font-size:20px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.sw.on{border-color:var(--signal);box-shadow:0 0 0 2px var(--asphalt) inset}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.setrow .t{font:700 16px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.setrow .d{font-size:12px;color:var(--muted);margin-top:2px}
.setrow>div:first-child{min-width:0}
.seg{display:flex;background:var(--panel-2);border-radius:7px;padding:3px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.seg button{font:700 13px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;padding:8px 9px 7px;border-radius:5px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--asphalt)}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.warn{font-size:12.5px;color:var(--signal);line-height:1.45}
input[type=range]{accent-color:var(--signal);width:130px;touch-action:pan-x}
.dmg{color:var(--kerb)}

/* ---------- Overlays ---------- */
#ovl{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(8,10,14,.72);
  padding:calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);box-sizing:border-box}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(480px,100%);max-height:100%;overflow-y:auto;touch-action:pan-y;box-sizing:border-box;display:grid;gap:12px}
.card h3{font:800 30px/1 var(--f-display);text-transform:uppercase;margin:0;letter-spacing:.01em}
.card .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.card .kv span:nth-child(odd){color:var(--muted);font:600 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.result-pos{font:800 italic 84px/.85 var(--f-display);color:var(--signal)}
.result-pos sup{font-size:.42em;vertical-align:top;margin-left:2px}
.result-pos small{font-size:.4em}
.rtable{width:100%;border-collapse:collapse;font-size:13px}
.rtable td{padding:6px 4px;border-top:1px solid var(--line)}
.rtable td:first-child{width:22px;font:700 15px var(--f-display);color:var(--muted)}
.rtable tr.me td{color:var(--signal)}
.rtable td.tm{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:2;pointer-events:none;font-family:var(--f-display)}
.hud-tl{position:absolute;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 14px);text-shadow:0 1px 6px rgba(0,0,0,.7)}
.hud-tl .pos{font:800 italic 54px/.85 var(--f-display)}
.hud-tl .pos small{font-size:24px;color:rgba(255,255,255,.75)}
.hud-tl .lap{font:700 15px var(--f-display);letter-spacing:.14em;margin-top:4px}
.hud-tl .lap b{font-size:20px;color:var(--signal)}
.hud-tl .gaps{font:600 13px var(--f-display);letter-spacing:.06em;margin-top:6px;line-height:1.35;font-variant-numeric:tabular-nums}
.hud-tl .gaps .a{color:var(--ok)}
.hud-tl .gaps .b{color:var(--kerb)}
.hud-tl .dmgbox{display:flex;align-items:center;gap:6px;margin-top:8px}
.hud-tl .dmgline{font:700 13px var(--f-display);letter-spacing:.1em;color:var(--kerb)}
#vwheel{position:absolute;width:120px;height:120px;pointer-events:none;opacity:.85;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.hud-tc{position:absolute;top:calc(var(--sat) + 10px);left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.hud-tc .time{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.hud-tc .sub{font:600 13px var(--f-display);letter-spacing:.12em;color:rgba(255,255,255,.85);margin-top:3px;font-variant-numeric:tabular-nums}
.hud-tc .sub .y{color:var(--signal)}
.hud-tr{position:absolute;top:calc(var(--sat) + 10px);right:calc(var(--sar) + 12px);display:flex;gap:8px;align-items:flex-start}
#mini{width:136px;height:136px;border-radius:50%}
#hCorner{position:absolute;top:calc(var(--sat) + 62px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:5px 12px 4px 8px;border-radius:10px;background:rgba(10,12,16,.55);font:800 22px/1 var(--f-display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
#hCorner small{font:700 13px var(--f-display);letter-spacing:.1em;color:rgba(255,255,255,.75)}
#hCorner svg{display:block}
#hCorner.warn{background:rgba(229,50,45,.75)}
.hbtn{pointer-events:auto;width:44px;height:44px;border-radius:10px;background:rgba(10,12,16,.55);display:grid;place-items:center;font:800 13px var(--f-display);letter-spacing:.04em}
.hud-col{display:grid;gap:8px}
.hud-bc{position:absolute;bottom:calc(var(--sab) + 10px);left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.hud-bc .spd{font:800 italic 58px/.85 var(--f-display);font-variant-numeric:tabular-nums}
.hud-bc .unit{font:700 13px var(--f-display);letter-spacing:.18em;color:rgba(255,255,255,.8)}
.hud-bc .unit b{color:var(--signal);font-size:16px}
.steerbar{width:150px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 8px;position:relative}
.steerbar i{position:absolute;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--signal);left:calc(50% - 5px)}
#camName{position:absolute;top:calc(var(--sat) + 158px);right:calc(var(--sar) + 14px);font:700 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#hMsg{position:absolute;top:34%;left:0;right:0;text-align:center;font:800 italic 64px/1 var(--f-display);text-transform:uppercase;text-shadow:0 2px 18px rgba(0,0,0,.6);letter-spacing:.02em}
#hMsg.small{font-size:34px}
#hMsg .y{color:var(--signal)}
#hMsg .r{color:var(--kerb)}
.lights{position:absolute;top:calc(var(--sat) + 70px);left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:8px 12px;background:rgba(10,12,16,.7);border-radius:12px}
.lights i{width:22px;height:22px;border-radius:50%;background:#3a1010}
.lights i.on{background:var(--kerb);box-shadow:0 0 16px var(--kerb)}
.lights.go i{background:var(--ok);box-shadow:0 0 16px var(--ok)}

/* ---------- Touch controls ---------- */
#touch{position:fixed;inset:0;z-index:1}
.pad{position:absolute;bottom:calc(var(--sab) + 14px);display:grid;place-items:center;border-radius:16px;
  background:rgba(12,14,18,.38);border:1.5px solid rgba(255,255,255,.22);font:800 16px var(--f-display);letter-spacing:.12em;color:rgba(255,255,255,.85)}
.pad.on{background:rgba(255,198,43,.35);border-color:var(--signal)}
#brakeBtn{width:100px;height:100px;left:calc(var(--sal) + 14px)}
#brakeBtn.r1{left:auto;right:calc(var(--sar) + 14px)}
#brakeBtn.r2{left:auto;right:calc(var(--sar) + 124px)}
#gasBtn{width:100px;height:130px;right:calc(var(--sar) + 14px)}
#leftBtn{width:86px;height:100px;left:calc(var(--sal) + 14px);font-size:26px}
#rightBtn{width:86px;height:100px;left:calc(var(--sal) + 112px);font-size:26px}
.hint{position:absolute;bottom:calc(var(--sab) + 150px);left:0;right:0;text-align:center;font:600 14px var(--f-display);letter-spacing:.12em;color:rgba(255,255,255,.8);text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.8)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
<canvas id="gl"></canvas>

<div id="touch" hidden>
  <div class="pad" id="brakeBtn">BRAKE</div>
  <div class="pad" id="gasBtn">GAS</div>
  <div class="pad" id="leftBtn">&#9664;</div>
  <div class="pad" id="rightBtn">&#9654;</div>
  <div class="hint" id="touchHint"></div>
  <div id="vwheel" hidden><svg viewBox="0 0 120 120" width="120" height="120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="9"/><circle cx="60" cy="60" r="13" fill="rgba(255,255,255,.55)"/><path d="M8 62 L47 62 M73 62 L112 62 M60 73 L60 112" stroke="rgba(255,255,255,.55)" stroke-width="9" stroke-linecap="round"/><rect x="55" y="4" width="10" height="12" rx="2" fill="#ffc62b"/></svg></div>
</div>

<div id="hud" hidden>
  <div class="hud-tl">
    <div class="pos num" id="hPosWrap"><span id="hPos">8</span><small>/<span id="hTot">8</span></small></div>
    <div class="lap" id="hLapWrap">LAP <b id="hLap" class="num">1/2</b></div>
    <div class="gaps" id="hGaps"></div>
    <div class="dmgbox"><svg width="30" height="46" viewBox="0 0 30 46" aria-label="Damage"><rect id="dmgF" x="5" y="1" width="20" height="10" rx="4"/><rect id="dmgL" x="1" y="13" width="6" height="20" rx="2"/><rect id="dmgRt" x="23" y="13" width="6" height="20" rx="2"/><rect id="dmgR" x="5" y="35" width="20" height="10" rx="4"/><rect x="9" y="14" width="12" height="18" rx="2" fill="rgba(255,255,255,.12)"/></svg><span class="dmgline" id="hDmg"></span></div>
  </div>
  <div class="hud-tc">
    <div class="time" id="hTime">0:00.000</div>
    <div class="sub" id="hSub">BEST --</div>
  </div>
  <div class="hud-tr">
    <canvas id="mini" width="236" height="236"></canvas>
    <div class="hud-col">
      <button class="hbtn" id="pauseBtn" aria-label="Pause">II</button>
      <button class="hbtn" id="camBtn" aria-label="Change camera">CAM</button>
    </div>
  </div>
  <div id="camName"></div>
  <div id="hCorner" hidden><svg id="hCornerArrow" width="30" height="30" viewBox="0 0 30 30"><path d="M8 27 L8 15 Q8 7 16 7 L22 7" fill="none" stroke="#ffc62b" stroke-width="4" stroke-linecap="round"/><path d="M18 2 L24 7 L18 12" fill="none" stroke="#ffc62b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="hCornerN">3</span><small id="hCornerD">120 M</small></div>
  <div class="lights" id="lights" hidden><i></i><i></i><i></i><i></i><i></i></div>
  <div id="hMsg"></div>
  <div class="hud-bc">
    <div class="steerbar"><i id="steerDot"></i></div>
    <div class="spd" id="hSpd">0</div>
    <div class="unit"><span id="hUnit">KM/H</span> · GEAR <b id="hGear">1</b></div>
  </div>
</div>

<div id="menu">
  <div id="rail"></div>
  <div id="carTag"></div>
</div>

<div id="ovl" hidden></div>
<div id="rotHint" hidden><svg width="64" height="64" viewBox="0 0 64 64"><rect x="18" y="6" width="28" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="4"/><path d="M8 40a24 24 0 0 0 20 16" fill="none" stroke="#ffc62b" stroke-width="4" stroke-linecap="round"/><path d="M28 50l0 7l-7-1" fill="none" stroke="#ffc62b" stroke-width="4" stroke-linecap="round"/></svg><div>Turn your phone sideways</div><button class="btn" data-act="rotflip">Other way round</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const wrapAng=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;};
const fmtTime=t=>{if(!isFinite(t)||t<=0)return '--:--.---';const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(3);};
const fmtCR=n=>Math.round(n).toLocaleString('en-US');
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};

function stepRace(dt){

    if(lit!==race.lastBeep&&lit>0){race.lastBeep=lit;AudioFX.beep(440,.15);if(lit===1&&race.ctl==='tilt')calibrateTilt();}
    if(race.cd<=0){race.state='racing';if(race.ctl==='tilt')calibrateTilt();$('#lights').classList.add('go');AudioFX.beep(880,.4,.16);showMsg('<span class="y">Go!</span>',.8,false);

  const n=Math.max(1,Math.ceil(dt*240)),h=dt/n;
  for(let s=0;s<n;s++){
    for(const c of act)stepCar(c,h);
    for(const c of act)wallCollide(c);
    for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++)carCollide(act[i],act[j]);
    for(const c of act)trackUpdate(c);
  }
  for(const c of act){c.hitCd-=dt;c.scrapeT-=dt;if(c.ghostT>0)c.ghostT-=dt;}
  const p=race.player;
  if(race.state==='racing'){
    if(lapMode())for(const c of act)lapCheck(c);else soloCheck(p);
    if(race.ev.type==='tt'&&p.lapsDone===0&&!race.done){const k=Math.floor(p.progress/4);while(race.rec.t.length<=k){race.rec.t.push(+(race.t-p.lapStart).toFixed(2));race.rec.d.push(+p.d.toFixed(1));}}

  if(race.ghost&&race.ghost.mesh.visible){const q=P(race.ghost.mesh.position.x,race.ghost.mesh.position.z);mctx.fillStyle='#9fd3ff';mctx.beginPath();mctx.arc(q[0],q[1],6,0,7);mctx.fill();}
  mctx.fillStyle='#ffc62b';mctx.strokeStyle='#12151b';mctx.lineWidth=3;mctx.beginPath();mctx.moveTo(cx,cy-11);mctx.lineTo(cx+8,cy+8);mctx.lineTo(cx,cy+4);mctx.lineTo(cx-8,cy+8);mctx.closePath();mctx.fill();mctx.stroke();
  mctx.restore();return;
  mctx.clearRect(0,0,236,236);mctx.drawImage(miniBase,0,0);
  for(const c of race.cars){if(c.eliminated||c.isPlayer)continue;const q=miniMap(c.x,c.z);mctx.fillStyle='#e5322d';mctx.beginPath();mctx.arc(q[0],q[1],6,0,7);mctx.fill();}
  if(race.ghost&&race.ghost.mesh.visible){const q=miniMap(race.ghost.mesh.position.x,race.ghost.mesh.position.z);mctx.fillStyle='#9fd3ff';mctx.beginPath();mctx.arc(q[0],q[1],6,0,7);mctx.fill();}
  const q=miniMap(race.player.x,race.player.z);mctx.fillStyle='#ffc62b';mctx.strokeStyle='#12151b';mctx.lineWidth=3;mctx.beginPath();mctx.arc(q[0],q[1],8,0,7);mctx.fill();mctx.stroke();
}

function showResults(){
  const ev=race.ev,key=race.key,p=race.player,st=standings(),pos=st.indexOf(p)+1,o=race.setup,u=speedUnit();
  let stars=0,mult=0,head='',table='';const best=p.laps.length?Math.min(...p.laps):0;
  const tgt=(v,tg,lower)=>lower?(v<=tg[0]?3:v<=tg[1]?2:v<=tg[2]?1:0):(v>=tg[0]?3:v>=tg[1]?2:v>=tg[2]?1:0);
  const starMult=s=>[.15,.4,.6,1][s];
  if(ev.type==='tt'){const t=p.laps[0]||Infinity;stars=tgt(t,o.targets,true);mult=starMult(stars);
    let newRec=false;if(p.laps[0]&&(!S.best[key]||p.laps[0]<S.best[key])){S.best[key]=p.laps[0];newRec=true;if(race.rec.t.length>10)S.ghosts[key]={t:race.rec.t,d:race.rec.d};}
    head=`<div class="result-pos">${fmtTime(t).replace(/^0:/,'')}</div>`;
    table=`<div class="kv"><span>★★★</span><span class="num">${fmtTime(o.targets[0])}</span><span>★★</span><span class="num">${fmtTime(o.targets[1])}</span><span>★</span><span class="num">${fmtTime(o.targets[2])}</span><span>Record</span><span class="num">${fmtTime(S.best[key])}${newRec?' · new, saved as your ghost':''}</span></div>`;}
  else if(ev.type==='snap'){const v=race.result||0;stars=tgt(v,o.targets);mult=starMult(stars);if(!S.best[key]||v>S.best[key])S.best[key]=v;
    head=`<div class="result-pos">${Math.round(v*u.k)}<small> ${u.l.toLowerCase()}</small></div>`;
    table=`<div class="kv">${o.targets.map((t,i)=>`<span>${'★'.repeat(3-i)}</span><span class="num">${Math.round(t*u.k)} ${u.l.toLowerCase()}</span>`).join('')}<span>Best</span><span class="num">${Math.round(S.best[key]*u.k)} ${u.l.toLowerCase()}</span></div>`;}
  else if(ev.type==='auto'){const t=race.result||Infinity;stars=tgt(t,o.targets,true);mult=starMult(stars);if(!S.best[key]||t<S.best[key])S.best[key]=t;
    head=`<div class="result-pos">${fmtTime(t).replace(/^0:/,'')}</div>`;
    table=`<div class="kv">${o.targets.map((t,i)=>`<span>${'★'.repeat(3-i)}</span><span class="num">${fmtTime(t)}</span>`).join('')}<span>Best</span><span class="num">${fmtTime(S.best[key])}</span></div>`;}
  else if(ev.type==='endur'){const d=race.result||0;stars=tgt(d,o.targets);mult=starMult(stars);if(!S.best[key]||d>S.best[key])S.best[key]=d;
    head=`<div class="result-pos">${(d/1000).toFixed(2)}<small> km</small></div>`;
    table=`<div class="kv">${o.targets.map((t,i)=>`<span>${'★'.repeat(3-i)}</span><span class="num">${(t/1000).toFixed(2)} km</span>`).join('')}<span>Best</span><span class="num">${(S.best[key]/1000).toFixed(2)} km</span></div>`;}
  else{
    if(ev.type==='h2h'){stars=pos===1?3:0;mult=pos===1?1:.2;}else{stars=pos===1?3:pos===2?2:pos===3?1:0;mult=[0,1,.6,.4][pos]||.15;}
    head=`<div class="result-pos">${pos}<sup>${ord(pos).slice(-2)}</sup></div>`;
    const leader=st[0];
    table='<table class="rtable">'+st.map((c,k)=>{let tm;
      if(c.eliminated)tm='Out';else if(c.finished)tm=k===0?fmtTime(c.finishTime):'+'+(c.finishTime-leader.finishTime).toFixed(3);
      else tm='+'+Math.max(1,(leader.progress-c.progress)/Math.max(c.v,20)).toFixed(1);
      return `<tr class="${c.isPlayer?'me':''}"><td>${k+1}</td><td>${c.isPlayer?'You':c.name}<div class="note">${CAR_BY[c.carId].name}</div></td><td class="tm">${tm}</td></tr>`;}).join('')+'</table>';
  }
  const earned=Math.round(ev.reward*mult/10)*10,prev=S.stars[key]||0;
  S.credits+=earned;S.stars[key]=Math.max(prev,stars);S.races++;
  const own=S.owned[p.carId];own.dmg=p.dmg;own.dz=Object.assign({},p.dz);own.dents=p.dents.slice(0,40);save();
  const newDmg=p.dmg-p.dmg0,rc=repairCost(p.carId,p.dmg);
  const starHtml=n=>'<span class="stars">'+'★'.repeat(n)+'<span class="off">'+'★'.repeat(3-n)+'</span></span>';
  openOverlay(`<div class="card">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">${head}<div style="text-align:right">${starHtml(stars)}<div class="chip" style="margin-top:8px"><span class="cr">+${fmtCR(earned)} CR</span></div></div></div>
    <div class="note">${EV_TYPES[ev.type].name} · ${race.def.name}${best&&ev.type!=='tt'?' · best lap '+fmtTime(best):''}${stars>prev?' · new best result':''}</div>
    ${table}
    ${p.dmg>.005?`<div class="setrow"><div><div class="t dmg">Damage ${Math.round(p.dmg*100)}%</div><div class="d">${newDmg>.004?'+'+Math.round(newDmg*100)+'% this race. ':''}Damage costs top speed and grip.</div></div><button class="btn ${S.credits>=rc?'y':''}" data-act="repair" ${S.credits>=rc?'':'disabled'}>Repair ${fmtCR(rc)}</button></div>`:''}
    <div class="btnrow"><button class="btn" data-act="restart">Race again</button><button class="btn y" data-act="continue">Continue</button></div>
  </div>`);
}

      <div class="setrow"><div><div class="t">Graphics</div><div class="d">Lower saves battery</div></div>${seg('quality',[['low','Low'],['auto','Med'],['high','High']])}</div>
      <div class="setrow"><div><div class="t">Reset progress</div><div class="d">Deletes cars, credits, stars and ghosts on this device</div></div>${UI.confirmReset?'<div class="btnrow"><button class="btn" data-act="resetno">Keep</button><button class="btn r" data-act="resetyes">Delete</button></div>':'<button class="btn" data-act="reset">Reset</button>'}</div>
      </div><div class="note">Circuit layouts come from the open f1-circuits dataset by Tomislav Bačinger (MIT licence). Keyboard: arrows or WASD, Space to brake, P pause, C camera.</div>`;
  }
};
function render(){
  rail.innerHTML=SCREENS[UI.screen]();
  let id=S.current,color=S.owned[S.current].color;
  if(UI.screen==='garage'&&UI.garageCar){id=UI.garageCar;color=S.owned[id].color;}
  if(UI.screen==='dealer'&&UI.dealerCar){id=UI.dealerCar;color=S.owned[id]?S.owned[id].color:CAR_BY[id].color;}
  setShowCar(id,color,S.owned[id]?S.owned[id].livery:null);
  const c=CAR_BY[id],st=carStats(id,S.owned[id]?S.owned[id].up:NOUP);
  carTag.innerHTML=`<span class="cls">CLASS ${c.cls}</span><h2>${c.name}</h2><div class="pr">PR <b class="num">${prOf(st)}</b></div><div class="spec">${c.spec}</div>`;
  [['sens','sens'],['tiltSens','tiltSens']].forEach(([el,k])=>{const n=$('#'+el);if(n)n.addEventListener('input',e=>{S.settings[k]=parseFloat(e.target.value);save();});});
}
function go(screen){UI.screen=screen;UI.confirmReset=false;render();rail.scrollTop=0;}
function eventModal(i){
  const s=SERIES[UI.series],e=s.events[i],t=TRACK_BY[e.track],key=s.id+'-'+i,ok=CAR_BY[S.current].cls===s.cls,o=eventSetup(e,s.cls),u=speedUnit();
  const ownedOk=Object.keys(S.owned).filter(k=>CAR_BY[k].cls===s.cls);
  const field={cup:8,h2h:2,elim:6}[e.type]||1;
  let extra='';
  if(e.type==='tt'||e.type==='auto')extra=`<span>Targets</span><span class="num">★★★ ${fmtTime(o.targets[0])} · ★★ ${fmtTime(o.targets[1])} · ★ ${fmtTime(o.targets[2])}</span>`;
  if(e.type==='snap')extra=`<span>Targets</span><span class="num">★★★ ${Math.round(o.targets[0]*u.k)} · ★★ ${Math.round(o.targets[1]*u.k)} · ★ ${Math.round(o.targets[2]*u.k)} ${u.l.toLowerCase()}</span>`;
  if(e.type==='endur')extra=`<span>Time</span><span>${o.time/60} minutes</span><span>Targets</span><span class="num">★★★ ${(o.targets[0]/1000).toFixed(2)} · ★★ ${(o.targets[1]/1000).toFixed(2)} · ★ ${(o.targets[2]/1000).toFixed(2)} km</span>`;
  const dist=['cup','h2h','elim','tt'].includes(e.type)?`<span>Distance</span><span class="num">${e.laps} × ${(t.len/1000).toFixed(3)} km</span>`:e.type==='auto'?`<span>Distance</span><span class="num">${(o.goal/1000).toFixed(2)} km sprint</span>`:e.type==='snap'?`<span>Run-up</span><span class="num">${Math.round(o.goal)} m</span>`:'';
  const own=S.owned[S.current];
  openOverlay(`<div class="card"><div><span class="tag y">${EV_TYPES[e.type].name}</span></div><h3>${t.name}</h3>
    <div class="note">${EV_TYPES[e.type].d}</div>
    <div class="kv"><span>Location</span><span>${t.place}</span>${dist}${field>1?`<span>Field</span><span>${field} cars</span>`:''}<span>Win</span><span class="num">${fmtCR(e.reward)} CR</span>${extra}
    <span>Your car</span><span>${CAR_BY[S.current].name} · PR ${prOf(carStats(S.current,own.up,own.dmg))}${own.dmg>.005?' · <span class="dmg">'+Math.round(own.dmg*100)+'% damaged</span>':''}</span><span>Best</span><span>${starStr(S.stars[key]||0)}</span></div>
    ${ok?'':`<div class="warn">This event needs a Class ${s.cls} car. ${ownedOk.length?'You own one: switch to it below.':'Buy one at the dealer.'}</div>`}
    <div class="btnrow"><button class="btn" data-act="close">Back</button>${ok?`<button class="btn y" data-act="race" data-i="${i}">Race</button>`:ownedOk.length?`<button class="btn y" data-act="select" data-id="${ownedOk[0]}" data-reopen="${i}">Use ${CAR_BY[ownedOk[0]].name}</button>`:`<button class="btn y" data-act="todealer" data-cls="${s.cls}">Dealer</button>`}</div></div>`);
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  switch(a){
    case 'go':go(b.dataset.to);break;
    case 'series':{const i=+b.dataset.i;if(totalStars()<SERIES[i].unlock)return;UI.series=i;go('series');break;}
    case 'event':eventModal(+b.dataset.i);break;
    case 'close':closeOverlay();break;
    case 'race':closeOverlay();startRace(UI.series,+b.dataset.i);break;
    case 'gcar':UI.garageCar=b.dataset.id;render();break;
    case 'select':S.current=b.dataset.id;save();render();if(b.dataset.reopen!==undefined)eventModal(+b.dataset.reopen);break;
    case 'upgrade':{const id=UI.garageCar,own=S.owned[id],k=b.dataset.k,lv=own.up[k];if(lv>=MAXUP)return;const cost=upCost(id,lv);if(S.credits<cost)return;S.credits-=cost;own.up[k]++;save();render();break;}
    case 'paint':S.owned[UI.garageCar].color=b.dataset.c;save();render();break;
    case 'livery':S.owned[UI.garageCar].livery=b.dataset.v;save();render();break;
    case 'repairG':{const id=UI.garageCar,own=S.owned[id],rc=repairCost(id,own.dmg);if(S.credits<rc)return;S.credits-=rc;clearDamage(own);save();render();break;}
    case 'repair':{if(!race)return;const p=race.player,own=S.owned[p.carId],rc=repairCost(p.carId,own.dmg);if(S.credits<rc)return;S.credits-=rc;clearDamage(own);p.dmg=0;save();b.closest('.setrow').innerHTML='<div class="t">Repaired</div>';break;}
    case 'dcar':UI.dealerCar=b.dataset.id;render();break;
    case 'buy':{const c=CAR_BY[b.dataset.id];if(S.owned[c.id]||S.credits<c.price)return;S.credits-=c.price;S.owned[c.id]=newOwn(c.id);S.current=c.id;save();render();break;}
    case 'todealer':closeOverlay();UI.dealerCar=CARS.find(c=>c.cls===b.dataset.cls).id;go('dealer');break;
    case 'set':{let v=b.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;S.settings[b.dataset.k]=v;save();if(b.dataset.k==='quality'){applyShadowSetting();resize();}
      if(b.dataset.k==='landscape'){tilt.autoRot=0;resize();}
      if(b.dataset.k==='controls'&&v==='tilt'){UI.tiltNote='';render();await testTilt();}render();break;}
    case 'testtilt':await testTilt();render();break;
    case 'pcam':S.settings.cam=b.dataset.v;save();if(race)race.camPos=null;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));break;
    case 'recal':calibrateTilt();togglePause(false);break;
    case 'reset-car':if(race){respawn(race.player);race.camPos=null;}togglePause(false);break;
    case 'copyurl':{const u=location.href;try{navigator.clipboard.writeText(u).then(()=>{b.textContent='Copied';},()=>{b.textContent='Copy failed: select the address above';});}catch(e){b.textContent='Select the address above';}break;}
    case 'rotflip':S.settings.landscape=S.settings.landscape==='flip'?'auto':'flip';tilt.autoRot=0;save();resize();break;
    case 'reset':UI.confirmReset=true;render();break;
    case 'resetno':UI.confirmReset=false;render();break;
    case 'resetyes':S=defaultSave();save();UI.confirmReset=false;UI.garageCar=null;render();break;
    case 'resume':togglePause(false);break;
    case 'restart':{const si=race.si,ei=race.ei;closeOverlay();endRaceScene();startRace(si,ei);break;}
    case 'quit':case 'continue':closeOverlay();endRaceScene();go('series');break;
  }
});
async function testTilt(){
  const ok=await enableTilt();
  UI.tiltNote=ok?'Tilt is working. It is calibrated at every race start, so hold the phone how you want “straight” to be when the lights come on.'
    :tilt.why==='denied'?'Motion access was refused. On iPhone, allow it when Safari asks (Settings › Apps › Safari › Advanced › Website Data clears an old refusal).'
    :tilt.why==='nosensor'?'This device has no motion sensor, so races will use the on-screen wheel.'
    :inFrame?'Tilt is blocked because the game is running inside Claude’s viewer, which does not let pages read the motion sensor. Open the game on its own (below) and try again there.'
    :'The motion sensor sent no readings. Check that Motion & Orientation Access is on in Settings › Apps › Safari.';
}

// =====================================================================
// LOOP
// =====================================================================
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(race){
    if(!race.paused){const n=Math.ceil(dt/(1/120));for(let k=0;k<n;k++)stepRace(dt/n);}
    updateVisuals(race.paused?0:dt);
    if(++hudTick%2===0)updateHUD();
    renderer.render(race.scene,camera);
  }else{
    show.angle+=dt*.3;const R=VW()<VH()?12:9;
    show.cam.position.set(Math.sin(show.angle)*R,2.1,Math.cos(show.angle)*R);show.cam.lookAt(0,.55,0);
    renderer.render(show.scene,show.cam);
  }
}
applyShadowSetting();resize();render();applyControlLayout();initCloud();
requestAnimationFrame(frame);
})();
</script>
